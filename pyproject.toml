[project]
name = "modelrouter"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "pyyaml", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
router = "modelrouter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["modelrouter"]
